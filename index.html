<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 25%, #ff9a9e 50%, #fad0c4 75%, #ffdde1 100%);
    background-size: 400% 400%;
    animation: gradientShift 18s ease infinite;
    position: relative;
    cursor: default;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.65;
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  .blob1 { width:500px;height:500px;background:radial-gradient(circle,#7ec8ff,#4a90e2);top:-100px;left:-100px;animation:move1 28s ease-in-out infinite; }
  .blob2 { width:450px;height:450px;background:radial-gradient(circle,#ff6b9d,#c44569);bottom:-80px;right:-80px;animation:move2 32s ease-in-out infinite; }
  .blob3 { width:400px;height:400px;background:radial-gradient(circle,#c39bd3,#8e44ad);top:40%;left:60%;animation:move3 35s ease-in-out infinite; }
  .blob4 { width:380px;height:380px;background:radial-gradient(circle,#ffd700,#ff9f43);top:60%;left:10%;animation:move4 30s ease-in-out infinite; }
  .blob5 { width:420px;height:420px;background:radial-gradient(circle,#ff9ec7,#ff4d6d);top:10%;right:20%;animation:move5 38s ease-in-out infinite; }

  @keyframes move1 { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(40vw,30vh) scale(1.2);} 66%{transform:translate(20vw,60vh) scale(0.9);} }
  @keyframes move2 { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(-35vw,-25vh) scale(1.15);} 66%{transform:translate(-50vw,-50vh) scale(0.95);} }
  @keyframes move3 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-40vw,20vh) scale(1.25);} }
  @keyframes move4 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(50vw,-30vh) scale(1.1);} }
  @keyframes move5 { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(-20vw,40vh) scale(1.2);} 66%{transform:translate(15vw,55vh) scale(0.85);} }

  .overlay {
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.2), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(255,182,193,0.25), transparent 50%);
    backdrop-filter: blur(1px);
    pointer-events: none;
    z-index: 1;
  }

  .glass-card {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 700px;
    max-width: 90vw;
    background: rgba(255, 255, 255, 0.28);
    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 40px;
    box-shadow: 0 25px 70px rgba(255, 105, 135, 0.4), inset 0 1px 0 rgba(255,255,255,0.7);
    animation: floatCard 7s ease-in-out infinite;
    z-index: 10;
    padding: 60px 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  @keyframes floatCard {
    0%,100% { transform: translate(-50%, -50%) translateY(0); }
    50%     { transform: translate(-50%, -50%) translateY(-15px); }
  }

  .legend-text {
    font-family: 'Cairo', sans-serif;
    font-size: 24px;
    line-height: 2.2;
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.3px;
    background: linear-gradient(135deg, #8e1c4a 0%, #4a148c 50%, #b71c4c 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmerText 6s ease-in-out infinite;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,0.9)) drop-shadow(0 2px 10px rgba(142, 28, 74, 0.4)) drop-shadow(0 0 20px rgba(255, 215, 0, 0.25));
    position: relative;
    padding: 10px 0;
  }

  @keyframes shimmerText {
    0%,100% { background-position: 0% 50%; }
    50%     { background-position: 100% 50%; }
  }

  .legend-text::before, .legend-text::after {
    font-family: 'Cairo', serif;
    font-size: 70px;
    position: absolute;
    line-height: 1;
    background: linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(255,215,0,0.6));
  }
  .legend-text::before { content: "❝"; top: -25px; right: -15px; }
  .legend-text::after  { content: "❞"; bottom: -50px; left: -15px; }

  .gold-divider {
    width: 180px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #b8860b, #ffd700, #b8860b, transparent);
    margin: 35px auto 25px;
    position: relative;
    box-shadow: 0 0 15px rgba(255,215,0,0.5);
  }
  .gold-divider::before {
    content: "✦";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    color: #b8860b;
    font-size: 18px;
    text-shadow: 0 0 15px #ffd700;
    background: rgba(255,255,255,0.2);
    padding: 0 10px;
  }

  .plane-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(15px);
    border: 2px solid rgba(255, 215, 0, 0.6);
    text-decoration: none;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 10px 30px rgba(255, 105, 135, 0.4), inset 0 1px 0 rgba(255,255,255,0.7), 0 0 25px rgba(255,215,0,0.3);
    animation: pulseIcon 2.5s ease-in-out infinite;
    cursor: pointer;
    margin-top: 10px;
    position: relative;
  }

  .plane-link svg {
    width: 50px;
    height: 50px;
    animation: flyPlane 3s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(142, 28, 74, 0.6));
  }

  .plane-link:hover {
    transform: scale(1.18) rotate(-8deg);
    background: rgba(255, 215, 0, 0.4);
    border-color: #ffd700;
    box-shadow: 0 15px 40px rgba(142,28,74,0.6), inset 0 1px 0 rgba(255,255,255,0.9), 0 0 50px rgba(255,215,0,0.8);
  }

  @keyframes flyPlane {
    0%, 100% { transform: translate(0, 0) rotate(-15deg); }
    25%      { transform: translate(3px, -4px) rotate(-10deg); }
    50%      { transform: translate(0, -6px) rotate(-20deg); }
    75%      { transform: translate(-3px, -3px) rotate(-12deg); }
  }

  @keyframes pulseIcon {
    0%,100% { box-shadow: 0 10px 30px rgba(255,105,135,0.4), inset 0 1px 0 rgba(255,255,255,0.7), 0 0 25px rgba(255,215,0,0.3); }
    50%     { box-shadow: 0 10px 30px rgba(255,105,135,0.4), inset 0 1px 0 rgba(255,255,255,0.7), 0 0 50px rgba(255,215,0,0.7); }
  }

  .particle {
    position: fixed;
    top: -60px;
    pointer-events: none;
    z-index: 5;
    opacity: 0.9;
    animation: fall linear infinite;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.7));
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  @media (max-width: 600px) {
    .legend-text { font-size: 18px; line-height: 2; }
    .glass-card { padding: 40px 25px; }
    .legend-text::before, .legend-text::after { font-size: 50px; }
  }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="blob blob4"></div>
<div class="blob blob5"></div>

<div class="overlay"></div>

<!-- 🎵 عنصر الصوت المخفي -->
<audio id="bgMusic" loop autoplay>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="glass-card">
  <p class="legend-text">
    وقد حَمَّلتني شُكراً طويلاً ثقيلاً لا أطيقُ بعدَه حراكا؛ إذ كنتُ في غمراتِ اليأسِ والضِّيق، فألقيتِ على مسامعي ما يطيبُ به الفؤاد حين قلتِ: "صوتُك جميل".. فملأتِني حياةً وازدهاراً.
  </p>
  <div class="gold-divider"></div>
  
  <a href="https://www.instagram.com/s.bl_dz/" target="_blank" class="plane-link" title="راسليني عبر إنستغرام">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"  stop-color="#8e1c4a"/>
          <stop offset="50%" stop-color="#4a148c"/>
          <stop offset="100%" stop-color="#b71c4c"/>
        </linearGradient>
      </defs>
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"
            fill="url(#planeGrad)"
            stroke="#fff"
            stroke-width="0.3"
            stroke-linejoin="round"/>
      <path d="M2 12l15 2" stroke="rgba(255,255,255,0.5)" stroke-width="0.5"/>
    </svg>
  </a>
</div>

<script>
  // 🎵 ضبط الصوت + التشغيل الذكي
  const bgMusic = document.getElementById('bgMusic');
  
  // 🔊 خفض الصوت إلى 30% ليكون مناسباً كخلفية هادئة
  bgMusic.volume = 0.3;
  
  window.addEventListener('load', () => {
    bgMusic.play().catch(() => {
      const playOnFirstInteraction = () => {
        bgMusic.play();
        document.removeEventListener('click', playOnFirstInteraction);
        document.removeEventListener('touchstart', playOnFirstInteraction);
      };
      document.addEventListener('click', playOnFirstInteraction);
      document.addEventListener('touchstart', playOnFirstInteraction);
    });
  });

  // الجزيئات المتحركة
  const symbols = ['🌸', '✨', '🦋', '🩷', '💫', '🌷', '🤍', '🪷'];
  const body = document.body;
  
  function createParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (Math.random() * 20 + 16) + 'px';
    const duration = Math.random() * 10 + 14;
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = Math.random() * 3 + 's';
    body.appendChild(p);
    setTimeout(() => p.remove(), (duration + 3) * 1000);
  }
  
  setInterval(createParticle, 800);
  for (let i = 0; i < 15; i++) setTimeout(createParticle, i * 300);
</script>

</body>
</html>
